<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" as="image" href="digital-world-background.webp" fetchpriority="high">

  <title>XAEROVA — Autonomous Drone Infrastructure</title>

  <meta name="description" content="Be among the first to discover XAEROVA. Get early access and updates about our autonomous drone system.">
  <link rel="canonical" href="https://xaerova.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="XAEROVA">
  <meta property="og:title" content="XAEROVA — Autonomous Drone Infrastructure">
  <meta property="og:description" content="Be among the first. Get exclusive updates and early access to XAEROVA.">
  <meta property="og:url" content="https://xaerova.com/">
  <meta property="og:image" content="https://xaerova.com/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="Favicon 3.PNG">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #078cff;
      --cyan: #00c8ff;
      --white: #f7fbff;
      --muted: rgba(235,245,255,.72);
      --panel: rgba(0,93,145,.78);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      isolation: isolate;
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background: #000;
      font-family: "Rajdhani", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(0,7,17,.35) 0%, rgba(0,9,20,.18) 42%, rgba(0,5,14,.58) 100%),
        url("digital-world-background.webp") center center / cover no-repeat;
      transform: scale(1.015);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 45%, transparent 20%, rgba(0,0,0,.25) 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      height: 62px;
      width: 100%;
      padding: 0 clamp(18px, 4vw, 58px);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      background: rgba(0,0,0,.88);
      border-bottom: 1px solid rgba(255,255,255,.12);
      position: relative;
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      width: fit-content;
    }

    .brand img {
      width: 112px;
      height: auto;
      max-height: 34px;
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3vw, 44px);
      white-space: nowrap;
      font-family: "Orbitron", sans-serif;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .32em;
      color: rgba(255,255,255,.8);
    }

    .nav-links a {
      transition: color .2s ease;
    }

    .nav-links a:hover,
    .dropdown-trigger:hover {
      color: var(--cyan);
    }

    .dropdown {
      position: relative;
    }

    .dropdown-trigger {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      font: inherit;
      letter-spacing: inherit;
    }

    .dropdown-arrow {
      font-size: 13px;
      transition: transform .2s ease;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 220px;
      padding: 8px;
      background: rgba(2, 12, 25, .97);
      border: 1px solid rgba(0, 150, 255, .42);
      border-radius: 5px;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
      z-index: 20;
      letter-spacing: .08em;
      white-space: normal;
    }

    .dropdown-menu a {
      display: block;
      padding: 12px 13px;
      color: rgba(255,255,255,.9);
      font: 600 12px "Rajdhani", sans-serif;
      letter-spacing: .08em;
    }

    .dropdown-menu a:hover {
      color: var(--cyan);
      background: rgba(0,140,255,.14);
    }

    .dropdown.open .dropdown-menu {
      display: block;
    }

    .dropdown.open .dropdown-arrow {
      transform: rotate(180deg);
    }

    @media (hover: hover) and (pointer: fine) {
      .dropdown:hover .dropdown-menu,
      .dropdown:focus-within .dropdown-menu {
        display: block;
      }

      .dropdown:hover .dropdown-arrow {
        transform: rotate(180deg);
      }
    }

    .right-tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      color: rgba(255,255,255,.9);
      transition: color .2s ease, transform .2s ease;
    }

    .social-link:hover {
      color: var(--cyan);
      transform: translateY(-2px);
    }

    .social-link svg {
      display: block;
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .language-switch {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 3px;
      overflow: hidden;
    }

    .language-switch button {
      border: 0;
      min-width: 42px;
      padding: 8px 10px;
      color: rgba(255,255,255,.72);
      background: transparent;
      cursor: pointer;
      font: 700 9px "Rajdhani", sans-serif;
      letter-spacing: .12em;
    }

    .language-switch button.active {
      color: white;
      background: var(--blue);
    }

    main {
      width: min(1120px, 100%);
      min-height: calc(100vh - 62px);
      margin: 0 auto;
      padding: clamp(35px, 5.2vh, 62px) 24px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: #000;
    }

    h1 {
      margin: 0 0 clamp(12px, 2.2vh, 25px);
      font: 800 clamp(42px, 8.4vw, 104px)/.98 "Orbitron", sans-serif;
      letter-spacing: -.045em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 12px rgba(0,153,255,.35), 0 0 35px rgba(0,130,255,.18);
    }

    /* Hidden original website content */
    .product-visual,
    .specs,
    .signup,
    .launch {
      display: none !important;
    }

    @media (min-width: 900px) and (min-height: 850px) {
      main {
        padding-top: 55px;
      }
    }

    .mobile-menu-toggle {
      display: none;
    }

    @media (max-width: 760px) {
      .topbar {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        flex-wrap: nowrap;
        height: 64px;
        min-height: 64px;
        padding: 0 15px;
        gap: 12px;
      }

      .brand {
        flex: 0 0 auto;
      }

      .brand img {
        width: 88px;
        max-height: 32px;
      }

      .mobile-menu-toggle {
        display: flex;
        flex: 0 0 38px;
        width: 38px;
        height: 38px;
        padding: 9px 7px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
        border: 1px solid rgba(0,153,255,.45);
        border-radius: 5px;
        background: rgba(0,100,180,.12);
        cursor: pointer;
      }

      .mobile-menu-toggle span {
        display: block;
        width: 21px;
        height: 2px;
        border-radius: 2px;
        background: #fff;
        transition: transform .2s ease, opacity .2s ease;
      }

      .mobile-menu-toggle.active span:first-child {
        transform: translateY(7px) rotate(45deg);
      }

      .mobile-menu-toggle.active span:nth-child(2) {
        opacity: 0;
      }

      .mobile-menu-toggle.active span:last-child {
        transform: translateY(-7px) rotate(-45deg);
      }

      .right-tools {
        flex: 0 0 auto;
        margin-left: auto;
      }

      .language-switch button {
        min-width: 36px;
        padding: 8px 7px;
      }

      .nav-links {
        display: none;
        position: absolute;
        top: 64px;
        left: 0;
        right: 0;
        width: 100%;
        padding: 18px 15px;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0;
        background: rgba(2,10,22,.98);
        border-bottom: 1px solid rgba(0,153,255,.35);
        box-shadow: 0 12px 25px rgba(0,0,0,.4);
        font-size: 10px;
        letter-spacing: .18em;
      }

      .nav-links.mobile-open {
        display: flex;
      }

      .nav-links > a,
      .nav-links .dropdown-trigger {
        display: flex;
        width: 100%;
        padding: 15px 10px;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255,255,255,.08);
      }

      .dropdown {
        width: 100%;
      }

      .dropdown-menu {
        position: static;
        width: 100%;
        min-width: 0;
        transform: none;
        margin: 0;
        padding: 5px 10px;
        border: 0;
        border-radius: 0;
        background: rgba(0,100,180,.12);
        box-shadow: none;
      }

      main {
        min-height: calc(100vh - 64px);
        padding: 38px 20px 32px;
        background: #000;
      }

      h1 {
        width: 100%;
        max-width: 540px;
        margin: 0 auto 18px;
        font-size: clamp(25px, 6.5vw, 42px);
        line-height: 1.15;
        letter-spacing: -.035em;
        text-wrap: balance;
      }
    }

    @media (max-width: 390px) {
      main {
        padding: 30px 15px 26px;
      }

      h1 {
        font-size: clamp(23px, 6.3vw, 29px);
      }
    }

    @media (max-width: 340px) {
      .brand img {
        width: 78px;
      }

      .topbar {
        padding: 0 10px;
        gap: 8px;
      }
    }

    @media (max-width: 900px) and (max-height: 500px) {
      main {
        padding-top: 20px;
      }

      h1 {
        font-size: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
      }
    }

    /* Final black-screen landing state */
    html,
    body {
      min-height: 100%;
      background: #000 !important;
    }

    body::before,
    body::after {
      display: none !important;
    }
  </style>
</head>

<body>

  <header class="topbar">

    <a class="brand" href="#" aria-label="XAEROVA home">
      <img src="no bg.png" alt="XAEROVA">
    </a>

    <nav class="nav-links" id="mainNavigation" aria-label="Main navigation">

      <a href="mailto:info@xaerova.com?subject=XAEROVA%20Investor%20Enquiry">
        INVESTORS
      </a>

      <a href="mailto:info@xaerova.com?subject=XAEROVA%20Press%20Enquiry">
        PRESS
      </a>

      <div class="dropdown" id="useCasesDropdown">

        <button
          class="dropdown-trigger"
          type="button"
          id="useCasesButton"
          aria-expanded="false"
          aria-controls="useCasesMenu"
        >
          <span>USE CASES</span>
          <span class="dropdown-arrow" aria-hidden="true">⌄</span>
        </button>

        <div class="dropdown-menu" id="useCasesMenu">
          <a href="#early-access">Agriculture</a>
          <a href="#early-access">Security &amp; Defense</a>
          <a href="#early-access">Nature Protection</a>
        </div>

      </div>
    </nav>

    <button
      class="mobile-menu-toggle"
      id="mobileMenuToggle"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="mainNavigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="right-tools">
      <div class="language-switch" role="group" aria-label="Select language">

        <button
          type="button"
          id="langENG"
          class="active"
          aria-pressed="true"
          onclick="setLanguage('en')"
        >
          ENG
        </button>

        <button
          type="button"
          id="langFR"
          aria-pressed="false"
          onclick="setLanguage('fr')"
        >
          FR
        </button>

      </div>
    </div>

  </header>

  <main>

    <h1 data-i18n="headline">
      AUTONOMOUS DRONE INFRASTRUCTURE
    </h1>

    <!-- Original website content remains in the HTML but is hidden by CSS -->

    <div class="product-visual">
      <img
        src="IMG_8199.JPG.jpeg"
        alt="XAEROVA SkyMind autonomous drone docking station"
      >
    </div>

    <section class="specs" id="specifications">
      <div class="spec">
        <strong>4K</strong>
        <span>Camera type</span>
      </div>

      <div class="spec">
        <strong>7Km</strong>
        <span>Communication range</span>
      </div>

      <div class="spec">
        <strong>72kph</strong>
        <span>Maximum speed</span>
      </div>

      <div class="spec">
        <strong>30MIN</strong>
        <span>Minimum flight time</span>
      </div>
    </section>

    <section class="signup" id="early-access">
      <h2>BE AMONG THE FIRST</h2>
    </section>

    <section class="launch" id="launch">
      <h2>COMING Q1 2027</h2>
    </section>

  </main>

  <script>
    const translations = {
      en: {
        headline: "AUTONOMOUS DRONE INFRASTRUCTURE"
      },
      fr: {
        headline: "INFRASTRUCTURE DE DRONES AUTONOMES"
      }
    };

    function setLanguage(lang) {
      const selected = translations[lang] ? lang : "en";

      document.documentElement.lang = selected;

      document.querySelectorAll("[data-i18n]").forEach((element) => {
        const key = element.getAttribute("data-i18n");

        if (translations[selected][key]) {
          element.textContent = translations[selected][key];
        }
      });

      document.getElementById("langENG").classList.toggle(
        "active",
        selected === "en"
      );

      document.getElementById("langFR").classList.toggle(
        "active",
        selected === "fr"
      );

      document.getElementById("langENG").setAttribute(
        "aria-pressed",
        String(selected === "en")
      );

      document.getElementById("langFR").setAttribute(
        "aria-pressed",
        String(selected === "fr")
      );
    }

    document.addEventListener("DOMContentLoaded", () => {

      const mobileMenuButton =
        document.getElementById("mobileMenuToggle");

      const mainNavigation =
        document.getElementById("mainNavigation");

      mobileMenuButton.addEventListener("click", () => {

        const isOpen =
          mainNavigation.classList.toggle("mobile-open");

        mobileMenuButton.classList.toggle("active", isOpen);

        mobileMenuButton.setAttribute(
          "aria-expanded",
          String(isOpen)
        );

        mobileMenuButton.setAttribute(
          "aria-label",
          isOpen
            ? "Close navigation menu"
            : "Open navigation menu"
        );
      });

      mainNavigation.querySelectorAll("a").forEach((link) => {

        link.addEventListener("click", () => {

          mainNavigation.classList.remove("mobile-open");
          mobileMenuButton.classList.remove("active");

          mobileMenuButton.setAttribute(
            "aria-expanded",
            "false"
          );
        });
      });

      const dropdown =
        document.getElementById("useCasesDropdown");

      const dropdownButton =
        document.getElementById("useCasesButton");

      dropdownButton.addEventListener("click", (event) => {

        event.stopPropagation();

        const isOpen = dropdown.classList.toggle("open");

        dropdownButton.setAttribute(
          "aria-expanded",
          String(isOpen)
        );
      });

      document.addEventListener("click", (event) => {

        if (
          !mainNavigation.contains(event.target) &&
          !mobileMenuButton.contains(event.target)
        ) {
          mainNavigation.classList.remove("mobile-open");
          mobileMenuButton.classList.remove("active");

          mobileMenuButton.setAttribute(
            "aria-expanded",
            "false"
          );
        }

        if (!dropdown.contains(event.target)) {
          dropdown.classList.remove("open");

          dropdownButton.setAttribute(
            "aria-expanded",
            "false"
          );
        }
      });

      dropdown.querySelectorAll(".dropdown-menu a").forEach((link) => {

        link.addEventListener("click", () => {

          dropdown.classList.remove("open");

          dropdownButton.setAttribute(
            "aria-expanded",
            "false"
          );
        });
      });

      const savedLanguage =
        localStorage.getItem("xaerova-language") || "en";

      setLanguage(savedLanguage);

    });
  </script>

</body>
</html>
